<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Distribution strategy map</title><style>body{margin:0;font:16px/1.6 'DM Sans',Arial,sans-serif;color:#1F2A25;background:#F3F5F3}
.top{background:#354A40;color:#fff}.top .in{padding-top:30px;padding-bottom:30px}
.in{max-width:960px;margin:0 auto;padding:0 24px}
.crumb a{color:#DCE5DF;font-size:14px}
h1{font:700 30px 'Space Grotesk',Arial,sans-serif;margin:8px 0 6px}
.top p{margin:0;color:#DCE5DF}
.prog{display:flex;align-items:center;gap:12px;margin-top:16px;font-weight:600;font-size:14px}.prog .bar{flex:0 1 300px;height:8px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:#B5D334}
main .in{padding-top:28px;padding-bottom:48px}
h2{font:700 20px 'Space Grotesk',Arial,sans-serif;color:#354A40;margin:24px 0 10px}
ul.chk{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
ul.chk li{background:#fff;border:1px solid #DCE0DD;border-radius:8px}
ul.chk label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer}
ul.chk input{margin-top:4px;width:18px;height:18px;accent-color:#354A40;flex:0 0 auto}
ul.chk label>span{min-width:0;flex:1}ul.chk b{display:block}ul.chk em{display:block;font-style:normal;font-size:14px;color:#4A5751}
ul.chk li.done{background:#F2F7E4;border-color:#B5D334}
pre{background:#1F2A25;color:#E4EAE6;font:13px/1.5 Consolas,Menlo,monospace;padding:12px 14px;border-radius:6px;overflow-x:auto;margin:8px 0 0;white-space:pre}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:32px;font-weight:600}.nav a{color:#354A40}
.card{background:#fff;border:1px solid #DCE0DD;border-radius:10px;padding:22px}
.mtable{overflow-x:auto;border:1px solid #DCE0DD;background:#fff}table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px;line-height:1.45}th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid #E6E8E6}thead th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:#4A5751;background:#F3F5F3}tbody th{white-space:nowrap}
.brand{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:14px}.brand input{font:inherit;padding:6px 10px;border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:6px}

ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}ol.steps a{display:grid;grid-template-columns:40px 1fr;gap:2px 14px;background:#fff;border:1px solid #DCE0DD;border-radius:10px;padding:16px;text-decoration:none;color:#1F2A25}ol.steps a:hover{border-color:#354A40}
ol.steps .n{grid-row:1/3;width:34px;height:34px;border-radius:50%;background:#354A40;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}ol.steps b{font-size:17px}ol.steps em{font-style:normal;font-size:14px;color:#4A5751}
details.ms{background:#fff;border:1px solid #DCE0DD;border-radius:10px;margin:0 0 10px;overflow:hidden}
details.ms>summary{list-style:none;cursor:pointer;display:flex;gap:14px;align-items:center;padding:14px 18px}
details.ms>summary::-webkit-details-marker{display:none}
details.ms>summary::after{content:"+";margin-left:auto;font-size:22px;color:#4A5751}
details.ms[open]>summary::after{content:"\2013"}
details.ms .n{flex:0 0 32px;height:32px;border-radius:50%;background:#354A40;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
details.ms .t b{display:block;font-size:17px;color:#1F2A25}details.ms .t em{display:block;font-style:normal;font-size:14px;color:#4A5751}
details.ms ul{margin:0;padding:4px 18px 16px 64px;border-top:1px solid #E6E8E6}
details.ms li{margin:8px 0;font-size:15px}details.ms li a{color:#354A40;font-weight:600}
.tools{display:flex;gap:10px;margin:0 0 14px}.tools button{font:600 14px 'DM Sans',sans-serif;padding:7px 12px;border:1px solid #354A40;background:#fff;color:#354A40;border-radius:6px;cursor:pointer}

.fig{background:#fff;border:1px solid #DCE0DD;border-radius:10px;padding:16px}.fig img{display:block;width:100%;max-width:760px;margin:0 auto}</style></head>
