<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>After BQ hands over the master</title><style>body{margin:0;font:16px/1.6 'DM Sans',Arial,sans-serif;color:#1F2A25;background:#F3F5F3}
.top{background:#354A40;color:#fff}.top .in{padding-top:30px;padding-bottom:30px}
.in{max-width:960px;margin:0 auto;padding:0 24px}
.crumb a{color:#DCE5DF;font-size:14px}
h1{font:700 30px 'Space Grotesk',Arial,sans-serif;margin:8px 0 6px}
.top p{margin:0;color:#DCE5DF}
.prog{display:flex;align-items:center;gap:12px;margin-top:16px;font-weight:600;font-size:14px}.prog .bar{flex:0 1 300px;height:8px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:#B5D334}
main .in{padding-top:28px;padding-bottom:48px}
h2{font:700 20px 'Space Grotesk',Arial,sans-serif;color:#354A40;margin:24px 0 10px}
ul.chk{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
ul.chk li{background:#fff;border:1px solid #DCE0DD;border-radius:8px}
ul.chk label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer}
ul.chk input{margin-top:4px;width:18px;height:18px;accent-color:#354A40;flex:0 0 auto}
ul.chk label>span{min-width:0;flex:1}ul.chk b{display:block}ul.chk em{display:block;font-style:normal;font-size:14px;color:#4A5751}
ul.chk li.done{background:#F2F7E4;border-color:#B5D334}
pre{background:#1F2A25;color:#E4EAE6;font:13px/1.5 Consolas,Menlo,monospace;padding:12px 14px;border-radius:6px;overflow-x:auto;margin:8px 0 0;white-space:pre}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:32px;font-weight:600}.nav a{color:#354A40}
.card{background:#fff;border:1px solid #DCE0DD;border-radius:10px;padding:22px}
.mtable{overflow-x:auto;border:1px solid #DCE0DD;background:#fff}table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px;line-height:1.45}th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid #E6E8E6}thead th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:#4A5751;background:#F3F5F3}tbody th{white-space:nowrap}
.brand{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:14px}.brand input{font:inherit;padding:6px 10px;border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:6px}
</style></head>
<body data-page="01-after-handover"><div class="top"><div class="in"><div class="crumb"><a href="index.html">Brand setup</a> › Step 1 of 8</div><h1>After BQ hands over the master</h1><p>Do these once, on the finished master template, before making any brand copy.</p>
<div class="brand">Brand: <input id="brand" type="text" placeholder="e.g. Unboxed" aria-label="Brand name (ticks are saved per brand)"></div><div class="prog"><span id="pc"></span><div class="bar"><i id="pb"></i></div></div></div></div>
<main><div class="in"><h2>Handover</h2><ul class="chk"><li><label><input type="checkbox" data-id="site-transfer-complete"><span><b>Site transfer complete</b><em>The master site is in your own Wix Studio workspace (full transfer, not collaborator access) and BQ’s access is removed.</em></span></label></li><li><label><input type="checkbox" data-id="acceptance-checklist-ticked"><span><b>Acceptance checklist ticked</b><em>Every item in section 7 of the master template page passes; ask BQ for the exported progress.json.</em></span></label></li><li><label><input type="checkbox" data-id="documentation-and-training-received"><span><b>Documentation and training received</b><em>BQ’s configuration notes and the training walkthrough (products, content edits, saving as a template).</em></span></label></li><li><label><input type="checkbox" data-id="third-party-accounts-are-yours"><span><b>Third-party accounts are yours</b><em>Payment provider, print-on-demand (e.g. Printful) and any connected service run under your own credentials.</em></span></label></li></ul><h2>Waitlist pre-fill snippet (your one piece of code)</h2><ul class="chk"><li><label><input type="checkbox" data-id="element-ids-set"><span><b>Element IDs set</b><em>On each of the four waitlist pages: the launch title text element ID = launchTitle; the Wix Form element ID = waitlistForm.</em></span></label></li><li><label><input type="checkbox" data-id="field-key-checked"><span><b>Field key checked</b><em>Open the form, select “You’re joining the waitlist for”, Advanced tab: note its field key (expected: launch). Use that key in the code.</em></span></label></li><li><label><input type="checkbox" data-id="code-added-to-each-waitlist-page"><span><b>Code added to each waitlist page</b><em>Page code panel (Dev Mode) on all four pages:<pre>$w.onReady(() =&gt; {
  $w(&#x27;#waitlistForm&#x27;).setFieldValues({ launch: $w(&#x27;#launchTitle&#x27;).text });
});</pre></em></span></label></li><li><label><input type="checkbox" data-id="tested"><span><b>Tested</b><em>Submit a test entry on each waitlist page; check Forms &amp; Submissions shows the launch title.</em></span></label></li></ul><h2>Final clean-up</h2><ul class="chk"><li><label><input type="checkbox" data-id="form-count-is-4-or-fewer"><span><b>Form count is 4 or fewer</b><em>Forms &amp; Submissions lists only: footer signup, contact, Work with us inquiry, waitlist. Event registration doesn’t count.</em></span></label></li><li><label><input type="checkbox" data-id="built-on-wix-studio-removed"><span><b>“Built on Wix Studio” removed</b><em>Delete it from the footer copyright line.</em></span></label></li><li><label><input type="checkbox" data-id="mockup-annotations-gone"><span><b>Mockup annotations gone</b><em>No build notes, placeholders like [Hero image] boxes or brand-kit switcher left on the live pages.</em></span></label></li><li><label><input type="checkbox" data-id="saved-as-a-wix-studio-template"><span><b>Saved as a Wix Studio template</b><em>Save the master as your reusable template; keep the master itself unchanged from now on (improve it, then duplicate again).</em></span></label></li></ul><div class="nav"><span></span><a href="02-duplicate-and-brand.html">Duplicate and apply the brand →</a></div></div></main><script>
(function(){var page=document.body.dataset.page,bi=document.getElementById('brand');
function key(){return 'bs.'+(bi&&bi.value.trim()?bi.value.trim().toLowerCase():'default')+'.'+page}
var boxes=[].slice.call(document.querySelectorAll('ul.chk input'));
function load(){var st={};try{st=JSON.parse(localStorage.getItem(key()))||{}}catch(e){}boxes.forEach(function(b){b.checked=!!st[b.dataset.id];b.closest('li').classList.toggle('done',b.checked)});prog()}
function save(){var st={};boxes.forEach(function(b){if(b.checked)st[b.dataset.id]=1});try{localStorage.setItem(key(),JSON.stringify(st))}catch(e){}}
function prog(){var n=boxes.filter(function(b){return b.checked}).length,t=document.getElementById('pc');if(t)t.textContent=n+' of '+boxes.length+' done';var i=document.getElementById('pb');if(i)i.style.width=(boxes.length?n/boxes.length*100:0)+'%'}
boxes.forEach(function(b){b.addEventListener('change',function(){b.closest('li').classList.toggle('done',b.checked);save();prog()})});
if(bi){try{bi.value=localStorage.getItem('bs.brand')||''}catch(e){}bi.addEventListener('change',function(){try{localStorage.setItem('bs.brand',bi.value)}catch(e){}load()})}
load()})();
</script></body></html>
